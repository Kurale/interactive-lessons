<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погоня на велосипедах: Задача на скорость</title>
<style>
/* CoursePlayer — стили автономного плеера (для детей 9–11 лет).
   Крупный шрифт (база 19px), кнопки ≥48px, мягкие палитры, дружелюбная анимация. */

.cp-shell {
  --p: #4a90d9;
  --p-dark: #2f6fb0;
  --p-soft: #eaf2fb;
  --good: #2e9e5b;
  --good-soft: #e6f6ec;
  --bad: #d64545;
  --bad-soft: #fdeaea;
  --ink: #23303f;
  --muted: #5c6b7c;
  --card: #ffffff;
  --bg: #f4f7fa;
  --radius: 18px;

  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
  font-size: 19px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
}

[data-palette='sun'] {
  --p: #f0932b;
  --p-dark: #cf7a15;
  --p-soft: #fdf1e0;
  --bg: #fdf8ef;
}

[data-palette='sea'] {
  --p: #4a90d9;
  --p-dark: #2f6fb0;
  --p-soft: #eaf2fb;
  --bg: #f4f7fa;
}

[data-palette='forest'] {
  --p: #3e9b4f;
  --p-dark: #2c7c3b;
  --p-soft: #e9f5ec;
  --bg: #f3f8f4;
}

/* ------------------------------- Каркас ---------------------------------- */

.cp-topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  background: var(--card);
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

.cp-progress {
  flex: 1;
  height: 12px;
  background: #e3e9f0;
  border-radius: 999px;
  overflow: hidden;
}

.cp-progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--p), var(--p-dark));
  border-radius: 999px;
  transition: width 0.4s ease;
}

.cp-starbox {
  font-size: 18px;
  white-space: nowrap;
  color: var(--muted);
}

.cp-star {
  font-size: 20px;
}

.cp-star-count {
  color: var(--ink);
}

.cp-stage {
  flex: 1;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 16px 96px;
  box-sizing: border-box;
}

.cp-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--card);
  border-top: 1px solid rgba(0, 0, 0, 0.08);
}

.cp-nav-spacer {
  flex: 1;
}

/* ------------------------------- Кнопки ---------------------------------- */

.cp-btn {
  font: inherit;
  font-weight: 700;
  min-height: 52px;
  padding: 10px 26px;
  border-radius: 16px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
  touch-action: manipulation;
}

.cp-btn:active {
  transform: translateY(2px) scale(0.99);
}

.cp-btn:focus-visible {
  outline: 3px solid var(--p);
  outline-offset: 2px;
}

.cp-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.cp-btn-primary {
  background: var(--p);
  color: #fff;
  box-shadow: 0 4px 0 var(--p-dark);
}

.cp-btn-primary:not(:disabled):hover {
  filter: brightness(1.06);
}

.cp-btn-primary:not(:disabled):active {
  box-shadow: 0 1px 0 var(--p-dark);
}

.cp-btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: #c8d2dd;
}

.cp-btn-ghost:hover {
  background: var(--p-soft);
}

.cp-btn-next {
  min-width: 150px;
}

/* ------------------------------- Карточки -------------------------------- */

.cp-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 4px 18px rgba(30, 50, 80, 0.08);
  padding: 28px;
  animation: cp-pop 0.35s ease;
}

@keyframes cp-pop {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ------------------------------- Титул ----------------------------------- */

.cp-title-card {
  text-align: center;
  padding: 44px 28px;
}

.cp-title-img img {
  max-width: min(420px, 80%);
  max-height: 300px;
  border-radius: 14px;
  object-fit: contain;
}

.cp-chips {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0 8px;
}

.cp-chip {
  font-size: 15px;
  color: var(--muted);
  background: var(--bg);
  border-radius: 999px;
  padding: 4px 14px;
}

.cp-title {
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.2;
  margin: 10px 0 6px;
}

.cp-subtitle {
  font-size: 21px;
  color: var(--muted);
  margin: 0 0 26px;
}

.cp-title-actions {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.cp-btn-start {
  font-size: 24px;
  min-height: 64px;
  padding: 12px 44px;
}

/* ------------------------------ Текстовый слайд --------------------------- */

.cp-slide-title {
  font-size: clamp(24px, 4vw, 32px);
  margin: 0 0 18px;
  color: var(--p-dark);
}

.cp-block-heading {
  font-size: 24px;
  margin: 22px 0 8px;
}

.cp-block-paragraph p {
  margin: 0 0 14px;
}

.cp-block-paragraph ul {
  margin: 0 0 14px;
  padding-left: 28px;
}

.cp-block-paragraph li {
  margin-bottom: 6px;
}

.cp-block-figure {
  margin: 18px 0;
  text-align: center;
}

.cp-block-figure img {
  max-width: 100%;
  max-height: 420px;
  border-radius: 14px;
}

/* ------------------------------- Озвучка --------------------------------- */

.cp-narration {
  display: flex;
  gap: 8px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed #d4dbe4;
}

.cp-narration-btn {
  font: inherit;
  min-height: 48px;
  padding: 6px 18px;
  border-radius: 14px;
  border: 2px solid var(--p);
  background: var(--p-soft);
  color: var(--p-dark);
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.cp-narration-btn:hover {
  filter: brightness(0.97);
}

/* --------------------------------- Тост ---------------------------------- */

.cp-toast {
  position: fixed;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%) translateY(16px);
  z-index: 20;
  max-width: min(560px, calc(100vw - 32px));
  background: var(--card);
  border-radius: 16px;
  border-left: 8px solid var(--good);
  box-shadow: 0 10px 30px rgba(20, 40, 70, 0.25);
  padding: 14px 20px;
  font-size: 19px;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.cp-toast-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.cp-toast-good {
  border-left-color: var(--good);
  background: var(--good-soft);
}

.cp-toast-bad {
  border-left-color: var(--bad);
  background: var(--bad-soft);
}

.cp-toast-info {
  border-left-color: var(--p);
  background: var(--p-soft);
}

/* ------------------------------ Видео-слайд ------------------------------- */

.cp-video-card {
  padding: 18px;
}

.cp-video-wrap {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
}

.cp-video-wrap video {
  display: block;
  width: 100%;
  max-height: 62vh;
}

.cp-video-overlay {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(18, 28, 40, 0.82);
  overflow-y: auto;
}

.cp-video-overlay .cp-question {
  width: min(560px, 100%);
  max-height: 100%;
  overflow-y: auto;
}

/* ------------------------------- Вопрос ----------------------------------- */

.cp-question {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px;
  animation: cp-pop 0.3s ease;
}

.cp-question-text {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 16px;
  line-height: 1.4;
}

.cp-question-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cp-q-options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

@media (min-width: 640px) {
  .cp-q-options {
    grid-template-columns: 1fr 1fr;
  }
}

.cp-q-option {
  font: inherit;
  min-height: 54px;
  padding: 10px 16px;
  border-radius: 14px;
  border: 2px solid #cfd8e3;
  background: var(--card);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.15s, background 0.15s;
}

.cp-q-option:hover {
  border-color: var(--p);
  background: var(--p-soft);
}

.cp-q-option:focus-visible {
  outline: 3px solid var(--p);
  outline-offset: 2px;
}

.cp-q-option.is-correct {
  border-color: var(--good);
  background: var(--good-soft);
}

.cp-q-option.is-wrong {
  border-color: var(--bad);
  background: var(--bad-soft);
}

.cp-q-option.is-chosen {
  border-color: var(--p);
  background: var(--p-soft);
}

.cp-q-checkmark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid #b7c2cf;
  display: inline-block;
  flex: none;
}

.cp-q-option.is-chosen .cp-q-checkmark {
  border-color: var(--p);
  background: var(--p);
  box-shadow: inset 0 0 0 3px #fff;
}

.cp-q-option.is-correct .cp-q-checkmark {
  border-color: var(--good);
  background: var(--good);
  box-shadow: inset 0 0 0 3px #fff;
}

.cp-q-submit {
  align-self: center;
  min-width: 180px;
}

.cp-q-input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.cp-q-input {
  flex: 1;
  min-width: 200px;
  font: inherit;
  min-height: 54px;
  padding: 8px 16px;
  border-radius: 14px;
  border: 2px solid #cfd8e3;
}

.cp-q-input.is-wrong {
  border-color: var(--bad);
  animation: cp-shake 0.4s ease;
}

/* ------------------------- Обратная связь вопроса ------------------------- */

.cp-question-feedback {
  display: none;
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  font-size: 19px;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

.cp-question-feedback.cp-feedback-show {
  display: flex;
  animation: cp-pop 0.3s ease;
}

.cp-feedback-good {
  background: var(--good-soft);
  border: 2px solid var(--good);
}

.cp-feedback-bad {
  background: var(--bad-soft);
  border: 2px solid var(--bad);
}

.cp-feedback-text {
  margin: 0;
}

.cp-feedback-audio {
  font: inherit;
  font-size: 16px;
  min-height: 44px;
  padding: 4px 14px;
  border-radius: 12px;
  border: 2px solid var(--p);
  background: var(--p-soft);
  color: var(--p-dark);
  cursor: pointer;
}

@keyframes cp-shake {
  0%, 100% {
    transform: translateX(0);
  }
  20% {
    transform: translateX(-7px);
  }
  40% {
    transform: translateX(7px);
  }
  60% {
    transform: translateX(-5px);
  }
  80% {
    transform: translateX(5px);
  }
}

.shake {
  animation: cp-shake 0.4s ease;
}

/* ---------------------- Слайд-изображение с зонами ------------------------ */

.cp-image-card {
  padding: 18px;
}

.cp-image-fig {
  position: relative;
  margin: 0;
  border-radius: 14px;
  overflow: hidden;
  background: #e8ecf1;
}

.cp-image-fig img {
  display: block;
  width: 100%;
  max-height: 62vh;
  object-fit: contain;
}

.cp-zones {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.cp-zone {
  fill: rgba(255, 255, 255, 0);
  stroke: none;
  pointer-events: all;
  cursor: pointer;
  transition: fill 0.2s ease;
}

.cp-zone-found {
  fill: rgba(46, 158, 91, 0.4);
  stroke: #1e7c42;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  animation: cp-zone-pop 0.35s ease;
  pointer-events: none;
}

.cp-zone-miss {
  fill: rgba(214, 69, 69, 0.35);
  stroke: #b03030;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  animation: cp-shake 0.4s ease;
}

.cp-zone-reveal {
  fill: rgba(244, 180, 0, 0.3);
  stroke: #f4b400;
  stroke-width: 3;
  vector-effect: non-scaling-stroke;
  animation: cp-zone-pulse 1.2s ease infinite alternate;
}

@keyframes cp-zone-pop {
  from {
    fill-opacity: 0;
  }
  to {
    fill-opacity: 1;
  }
}

@keyframes cp-zone-pulse {
  from {
    fill-opacity: 0.2;
  }
  to {
    fill-opacity: 0.55;
  }
}

/* ------------------------------ SVG-слайд --------------------------------- */

.cp-svg-card {
  padding: 18px;
}

.cp-svg-host {
  border-radius: 14px;
  background: #fff;
  padding: 10px;
  display: flex;
  justify-content: center;
  overflow: hidden;
}

.cp-svg-host svg {
  max-width: 100%;
  max-height: 56vh;
  height: auto;
}

.cp-svg-bar {
  display: flex;
  justify-content: center;
  margin-top: 12px;
}

.cp-svg-question {
  margin-top: 14px;
}

/* ------------------------------- Квиз-слайд -------------------------------- */

.cp-quiz-card {
  padding: 26px;
}

.cp-quiz-card .cp-question {
  padding: 0;
  border: none;
  animation: none;
}

.cp-svg-question .cp-question {
  padding: 0;
  border: none;
}

/* --------------------------------- Финал --------------------------------- */

.cp-final-card {
  text-align: center;
  padding: 46px 26px;
}

.cp-final-trophy {
  font-size: 72px;
  animation: cp-bounce 1.2s ease infinite alternate;
}

@keyframes cp-bounce {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-10px);
  }
}

.cp-final-title {
  font-size: clamp(30px, 5vw, 44px);
  margin: 6px 0 16px;
}

.cp-final-stars {
  font-size: 42px;
  letter-spacing: 6px;
  margin: 10px 0;
}

.cp-final-star {
  color: #d5dbe3;
}

.cp-final-star.is-earned {
  color: #f4b400;
  text-shadow: 0 0 12px rgba(244, 180, 0, 0.55);
  animation: cp-star-pop 0.5s ease backwards;
}

@keyframes cp-star-pop {
  from {
    transform: scale(0.3);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.cp-final-score {
  font-size: 21px;
  color: var(--muted);
  margin-bottom: 10px;
}

.cp-final-msg {
  font-size: 22px;
  margin: 14px 0 6px;
}

.cp-final-praise {
  font-size: 19px;
  color: var(--muted);
  font-style: italic;
}

.cp-final-card .cp-btn-primary {
  margin-top: 20px;
}

/* --------------------------- Мелкие экраны ------------------------------- */

@media (max-width: 600px) {
  .cp-shell {
    font-size: 18px;
  }
  .cp-card {
    padding: 20px 16px;
  }
  .cp-btn-next {
    min-width: 120px;
  }
}

</style>
</head>

<script>
/*!
 * CoursePlayer — рантайм автономного плеера школьных курсов.
 * Vanilla JS без зависимостей: один и тот же файл инлайнится в предпросмотр
 * редактора и в экспортируемый HTML-файл. Работает с file:// и офлайн.
 *
 * Публичный API: CoursePlayer.mount(container, projectData, options) -> controller
 *   options: { startAt: number, persist: boolean }
 */
(function () {
  'use strict';

  /* ================================ Утилиты ================================ */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  /** Нормализация текстового ответа: регистр, ё/е, пробелы. */
  function normalizeAnswer(s) {
    return String(s || '').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
  }

  /** Мини-разметка для абзацев: **жирный**, строки «- » → список. */
  function richHtml(text) {
    var lines = String(text || '').split(/\r?\n/);
    var out = '';
    var listOpen = false;
    for (var i = 0; i < lines.length; i++) {
      var t = esc(lines[i].trim()).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (/^- /.test(t)) {
        if (!listOpen) {
          out += '<ul>';
          listOpen = true;
        }
        out += '<li>' + t.replace(/^- /, '') + '</li>';
      } else {
        if (listOpen) {
          out += '</ul>';
          listOpen = false;
        }
        if (t) out += '<p>' + t + '</p>';
      }
    }
    if (listOpen) out += '</ul>';
    return out;
  }

  /* ========================= Звуковой движок (Web Audio) ==================== */

  function AudioFx() {
    var ctx = null;
    function ensure() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try {
            ctx = new AC();
          } catch (e) {
            ctx = null;
          }
        }
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, delay, dur, type, vol) {
      var c = ensure();
      if (!c) return;
      try {
        var t = c.currentTime + delay;
        var osc = c.createOscillator();
        var g = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      } catch (e) {
        /* звук не критичен */
      }
    }
    return {
      unlock: ensure,
      correct: function () {
        tone(523.25, 0, 0.14);
        tone(659.25, 0.1, 0.16);
        tone(783.99, 0.2, 0.3);
      },
      wrong: function () {
        tone(196, 0, 0.28, 'sine', 0.11);
        tone(174.61, 0.16, 0.34, 'sine', 0.09);
      },
      star: function () {
        tone(1046.5, 0, 0.12, 'triangle', 0.14);
        tone(1318.5, 0.09, 0.2, 'triangle', 0.14);
      },
      click: function () {
        tone(660, 0, 0.05, 'triangle', 0.05);
      },
    };
  }

  /* ============================= Прогресс (localStorage) =================== */

  function Progress(courseId, enabled) {
    var key = 'ci-progress-' + courseId;
    function load() {
      if (!enabled) return null;
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }
    function save(state) {
      if (!enabled) return;
      try {
        localStorage.setItem(key, JSON.stringify(state));
      } catch (e) {
        /* приватный режим — прогресс не критичен */
      }
    }
    function clear() {
      if (!enabled) return;
      try {
        localStorage.removeItem(key);
      } catch (e) {
        /* ничего */
      }
    }
    return { load: load, save: save, clear: clear };
  }

  function newState() {
    return { v: 1, index: 0, tasks: {}, stars: {}, attempts: {}, finished: false };
  }

  /* ================================ Плеер =================================== */

  function mount(container, data, options) {
    options = options || {};
    var course = data && data.course;
    if (!course || !Array.isArray(course.slides) || course.slides.length === 0) {
      container.innerHTML =
        '<div style="font-family:system-ui;padding:40px;text-align:center;color:#555">Курс не найден или повреждён.</div>';
      return { destroy: function () {} };
    }

    var slides = course.slides;
    var settings = course.settings || {};
    var media = {};
    (course.mediaLibrary || []).forEach(function (m) {
      media[m.id] = m;
    });
    function srcOf(id) {
      return id && media[id] ? media[id].src : '';
    }
    function nameOf(id) {
      return id && media[id] ? media[id].name : '';
    }

    var fx = AudioFx();
    var store = Progress(course.id, options.persist !== false);

    var state = newState();
    var saved = store.load();
    var hasProgress = !!(saved && !saved.finished && saved.index > 0 && saved.index < slides.length);
    if (saved) {
      state.tasks = saved.tasks || {};
      state.stars = saved.stars || {};
      state.attempts = saved.attempts || {};
    }

    var destroyed = false;
    var current = null; // активный слайд-контроллер { node, enter, leave }

    /* ------------------------------- Каркас DOM ---------------------------- */

    var shell = el('div', 'cp-shell');
    var palette = (course.theme && course.theme.palette) || 'sea';
    shell.dataset.palette = palette;
    if (palette === 'custom' && course.theme && course.theme.primaryColor) {
      shell.style.setProperty('--p', course.theme.primaryColor);
    }

    var topbar = el('div', 'cp-topbar');
    var progressTrack = el('div', 'cp-progress');
    var progressFill = el('div', 'cp-progress-fill');
    progressTrack.appendChild(progressFill);
    var starBox = el('div', 'cp-starbox', '<span class="cp-star">⭐</span> <b class="cp-star-count">0</b>');
    topbar.appendChild(progressTrack);
    topbar.appendChild(starBox);

    var stage = el('div', 'cp-stage');

    var nav = el('div', 'cp-nav');
    var btnBack = el('button', 'cp-btn cp-btn-back', '← Назад');
    var btnNext = el('button', 'cp-btn cp-btn-next cp-btn-primary', 'Далее →');
    btnBack.type = 'button';
    btnNext.type = 'button';
    nav.appendChild(btnBack);
    nav.appendChild(el('div', 'cp-nav-spacer'));
    nav.appendChild(btnNext);

    shell.appendChild(topbar);
    shell.appendChild(stage);
    shell.appendChild(nav);
    container.appendChild(shell);

    var toast = null;
    var toastTimer = null;

    function showToast(kind, html, sticky) {
      hideToast();
      toast = el('div', 'cp-toast cp-toast-' + kind, html);
      shell.appendChild(toast);
      requestAnimationFrame(function () {
        toast.classList.add('cp-toast-show');
      });
      if (!sticky) {
        toastTimer = setTimeout(hideToast, 4200);
      }
    }

    function hideToast() {
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
      if (toast && toast.parentNode) toast.remove();
      toast = null;
    }

    /* ---------------------------- Состояние заданий ------------------------ */

    function taskDone(taskId) {
      return !!state.tasks[taskId];
    }
    function firstTry(taskId) {
      return !state.attempts[taskId];
    }
    function failAttempt(taskId) {
      state.attempts[taskId] = (state.attempts[taskId] || 0) + 1;
      store.save(state);
    }
    /** Отмечает задание выполненным; звезда — если с первой попытки. */
    function completeTask(taskId) {
      var wasDone = state.tasks[taskId];
      state.tasks[taskId] = true;
      var gotStar = !wasDone && firstTry(taskId);
      if (gotStar) {
        state.stars[taskId] = true;
        fx.star();
      }
      store.save(state);
      updateChrome();
      return gotStar;
    }

    function starCount() {
      return Object.keys(state.stars).length;
    }

    /** Сколько всего заданий в курсе (для финального экрана). */
    function totalTasks() {
      var n = 0;
      slides.forEach(function (s) {
        if (s.type === 'video') n += (s.stopPoints || []).length;
        else if (s.type === 'quiz' || s.type === 'image') n += 1;
        else if (s.type === 'svg' && s.question) n += 1;
      });
      return n;
    }

    /* --------------------------------- Навигация --------------------------- */

    function slideDone(slide) {
      switch (slide.type) {
        case 'title':
        case 'text':
        case 'final':
          return true;
        case 'video':
          return pointsOf(slide).every(function (p) {
            return taskDone('sp-' + slide.id + '-' + p.id);
          });
        case 'image':
          return taskDone('img-' + slide.id);
        case 'svg':
          return !slide.question || taskDone('svgq-' + slide.id);
        case 'quiz':
          return taskDone('q-' + slide.id);
        default:
          return true;
      }
    }

    function pointsOf(slide) {
      var pts = (slide.stopPoints || []).slice();
      pts.sort(function (a, b) {
        return a.time - b.time;
      });
      return pts;
    }

    function goTo(i) {
      if (destroyed || i < 0 || i >= slides.length) return;
      if (current && current.leave) current.leave();
      hideToast();
      state.index = i;
      store.save(state);
      var slide = slides[i];
      current = renderSlide(slide);
      stage.innerHTML = '';
      if (current && current.node) stage.appendChild(current.node);
      if (current && current.enter) current.enter();
      updateChrome();
      shell.scrollTop = 0;
    }

    function next() {
      if (state.index >= slides.length - 1) return;
      if (!slideDone(slides[state.index])) {
        fx.click();
        return;
      }
      fx.click();
      goTo(state.index + 1);
    }

    function back() {
      if (state.index <= 0 || !settings.allowSlideBack) return;
      fx.click();
      goTo(state.index - 1);
    }

    btnNext.addEventListener('click', next);
    btnBack.addEventListener('click', back);

    function updateChrome() {
      var i = state.index;
      var slide = slides[i];
      progressFill.style.width = Math.round(((i + 1) / slides.length) * 100) + '%';
      starBox.querySelector('.cp-star-count').textContent = String(starCount());

      var isTitle = slide.type === 'title';
      var isFinal = slide.type === 'final';
      nav.style.display = isTitle || isFinal ? 'none' : 'flex';
      topbar.style.display = isTitle ? 'none' : 'flex';
      btnBack.style.visibility = i > 0 && settings.allowSlideBack ? 'visible' : 'hidden';
      btnNext.disabled = !slideDone(slide);
    }

    document.addEventListener('keydown', keydown);
    function keydown(e) {
      if (destroyed) return;
      var tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === 'ArrowRight' && !btnNext.disabled && nav.style.display !== 'none') next();
      if (e.key === 'ArrowLeft' && btnBack.style.visibility === 'visible') back();
    }

    /* ------------------------------- Рендер слайдов ------------------------ */

    function renderSlide(slide) {
      switch (slide.type) {
        case 'title':
          return renderTitle(slide);
        case 'text':
          return renderText(slide);
        case 'video':
          return renderVideo(slide);
        case 'image':
          return renderImage(slide);
        case 'svg':
          return renderSvg(slide);
        case 'quiz':
          return renderQuiz(slide);
        case 'final':
          return renderFinal(slide);
        default:
          return renderStub(slide);
      }
    }

    function renderStub(slide) {
      var box = el(
        'div',
        'cp-card cp-stub',
        '<div class="cp-stub-icon">🧩</div><h2>' +
          esc(slide.title || 'Слайд') +
          '</h2><p>Слайды этого типа поддерживаются в следующей версии редактора.</p>',
      );
      return { node: box };
    }

    /* Титульный слайд */
    function renderTitle(slide) {
      var box = el('div', 'cp-card cp-title-card');
      var html = '<div class="cp-title-inner">';
      var mascot = course.theme && course.theme.mascotId ? srcOf(course.theme.mascotId) : '';
      if (mascot) html += '<div class="cp-title-img cp-mascot"><img src="' + mascot + '" alt=""></div>';
      var img = slide.imageId ? srcOf(slide.imageId) : '';
      if (img) html += '<div class="cp-title-img"><img src="' + img + '" alt=""></div>';
      if (course.subject || (course.gradeRange && course.gradeRange.length)) {
        html += '<div class="cp-chips">';
        if (course.subject) html += '<span class="cp-chip">' + esc(course.subject) + '</span>';
        if (course.gradeRange) {
          var gr =
            course.gradeRange[0] === course.gradeRange[1]
              ? course.gradeRange[0] + ' класс'
              : course.gradeRange[0] + '–' + course.gradeRange[1] + ' класс';
          html += '<span class="cp-chip">' + esc(gr) + '</span>';
        }
        if (course.author) html += '<span class="cp-chip">Автор: ' + esc(course.author) + '</span>';
        html += '</div>';
      }
      html += '<h1 class="cp-title">' + esc(slide.title || course.title || 'Курс') + '</h1>';
      if (slide.subtitle) html += '<p class="cp-subtitle">' + esc(slide.subtitle) + '</p>';
      html += '<div class="cp-title-actions">';
      if (hasProgress) html += '<button type="button" class="cp-btn cp-btn-ghost" data-act="restart">Начать заново</button>';
      html +=
        '<button type="button" class="cp-btn cp-btn-primary cp-btn-start">' +
        (hasProgress ? 'Продолжить' : 'Начать') +
        '!</button>';
      html += '</div></div>';
      box.innerHTML = html;

      box.querySelector('.cp-btn-start').addEventListener('click', function () {
        fx.unlock();
        goTo(hasProgress ? clamp(saved.index, 1, slides.length - 1) : 1);
      });
      var restartBtn = box.querySelector('[data-act="restart"]');
      if (restartBtn) {
        restartBtn.addEventListener('click', function () {
          fx.unlock();
          state = newState();
          store.clear();
          hasProgress = false;
          saved = null;
          goTo(1);
        });
      }
      return { node: box };
    }

    /* Текстовый слайд */
    function renderText(slide) {
      var box = el('div', 'cp-card cp-text-card');
      var html = '<h2 class="cp-slide-title">' + esc(slide.title || '') + '</h2>';
      var inner = el('div', 'cp-text-body');
      inner.innerHTML = html;

      (slide.blocks || []).forEach(function (b) {
        if (b.kind === 'heading') {
          inner.appendChild(el('h3', 'cp-block-heading', esc(b.text)));
        } else if (b.kind === 'paragraph') {
          var p = el('div', 'cp-block-paragraph');
          p.innerHTML = richHtml(b.text);
          inner.appendChild(p);
        } else if (b.kind === 'image' && b.imageId) {
          var wrap = el('figure', 'cp-block-figure');
          wrap.innerHTML = '<img src="' + srcOf(b.imageId) + '" alt="' + esc(nameOf(b.imageId)) + '">';
          inner.appendChild(wrap);
        }
      });
      box.appendChild(inner);

      var ctrl = attachNarration(box, slide.narration);
      return { node: box, enter: ctrl.enter, leave: ctrl.leave };
    }

    /** Аудио-озвучка слайда: автозапуск + кнопки пауза/повторить. */
    function attachNarration(card, narration) {
      if (!narration || !media[narration.mediaId]) return {};
      var audio = new Audio(srcOf(narration.mediaId));
      audio.preload = 'auto';

      var bar = el('div', 'cp-narration');
      bar.innerHTML =
        '<button type="button" class="cp-narration-btn" data-act="toggle" aria-label="Прослушать озвучку">' +
        '<span class="cp-narration-icon">🔊</span><span class="cp-narration-label">Слушать</span></button>' +
        '<button type="button" class="cp-narration-btn" data-act="replay" aria-label="Повторить озвучку">↺</button>';
      card.appendChild(bar);

      var toggle = bar.querySelector('[data-act="toggle"]');
      var label = bar.querySelector('.cp-narration-label');
      var icon = bar.querySelector('.cp-narration-icon');

      function setUI(playing) {
        icon.textContent = playing ? '⏸' : '🔊';
        label.textContent = playing ? 'Пауза' : 'Слушать';
      }
      toggle.addEventListener('click', function () {
        fx.unlock();
        if (audio.paused) {
          audio.play().catch(function () {});
        } else {
          audio.pause();
        }
      });
      bar.querySelector('[data-act="replay"]').addEventListener('click', function () {
        fx.unlock();
        audio.currentTime = 0;
        audio.play().catch(function () {});
      });
      audio.addEventListener('play', function () {
        setUI(true);
      });
      audio.addEventListener('pause', function () {
        setUI(false);
      });

      return {
        enter: function () {
          if (narration.autoplay) audio.play().catch(function () {});
        },
        leave: function () {
          audio.pause();
          audio.currentTime = 0;
        },
      };
    }

    /* ==================== Компонент вопроса (общий) ======================== */

    /**
     * Рендерит вопрос и обрабатывает ответы.
     * onResult(correct) вызывается после каждого ответа.
     * Возвращает { box, isAnsweredCorrectly, disable }.
     */
    function mountQuestion(q, opts) {
      opts = opts || {};
      var answeredCorrect = false;

      var box = el('div', 'cp-question');
      var text = el('div', 'cp-question-text', esc(q.text));
      box.appendChild(text);

      var body = el('div', 'cp-question-body');
      box.appendChild(body);

      var feedback = el('div', 'cp-question-feedback');
      box.appendChild(feedback);

      function showFeedback(kind, textValue, audioId, actionBtn) {
        feedback.innerHTML = '';
        feedback.className = 'cp-question-feedback cp-feedback-' + kind;
        var p = el('p', 'cp-feedback-text', esc(textValue));
        feedback.appendChild(p);
        if (audioId && media[audioId]) {
          var audio = new Audio(srcOf(audioId));
          var btn = el('button', 'cp-feedback-audio', '🔊 Послушать');
          btn.type = 'button';
          btn.addEventListener('click', function () {
            audio.currentTime = 0;
            audio.play().catch(function () {});
          });
          feedback.appendChild(btn);
          // Автопроигрывание звука объяснения/похвалы — клик по ответу уже разблокировал звук.
          audio.play().catch(function () {});
        }
        if (actionBtn) feedback.appendChild(actionBtn);
        feedback.classList.add('cp-feedback-show');
      }

      function handleCorrect() {
        answeredCorrect = true;
        fx.correct();
        var gotStar = opts.onResult ? opts.onResult(true) : false;
        var praise = q.onCorrect && q.onCorrect.praise ? q.onCorrect.praise : 'Молодец!';
        var label = (gotStar ? '⭐ ' : '✅ ') + praise;
        var btn = opts.continueLabel
          ? el('button', 'cp-btn cp-btn-primary cp-feedback-continue', esc(opts.continueLabel))
          : null;
        if (btn) {
          btn.type = 'button';
          btn.addEventListener('click', function () {
            if (opts.onContinue) opts.onContinue();
          });
        }
        showFeedback('good', label, q.onCorrect && q.onCorrect.praiseAudioId, btn);
      }

      function handleWrong() {
        fx.wrong();
        if (opts.onResult) opts.onResult(false);
        var btn = opts.retryLabel
          ? el('button', 'cp-btn cp-btn-ghost cp-feedback-retry', esc(opts.retryLabel))
          : null;
        if (btn) {
          btn.type = 'button';
          btn.addEventListener('click', function () {
            if (opts.onRetry) opts.onRetry();
          });
        }
        showFeedback('bad', '💡 ' + (q.onWrong && q.onWrong.explanation ? q.onWrong.explanation : 'Попробуй ещё!'), q.onWrong && q.onWrong.explanationAudioId, btn);
      }

      /* --- один вариант --- */
      if (q.type === 'single-choice' || q.type === 'true-false') {
        var options = q.type === 'true-false' ? ['Верно', 'Неверно'] : q.options || [];
        var list = el('div', 'cp-q-options');
        options.forEach(function (opt, i) {
          var b = el('button', 'cp-q-option', esc(opt));
          b.type = 'button';
          b.addEventListener('click', function () {
            if (answeredCorrect) return;
            Array.prototype.forEach.call(list.children, function (c) {
              c.classList.remove('is-wrong', 'shake');
            });
            var correct = q.type === 'true-false' ? (i === 0) === !!q.correct : (q.correct || []).indexOf(i) >= 0;
            if (correct) {
              b.classList.add('is-correct');
              handleCorrect();
            } else {
              b.classList.add('is-wrong', 'shake');
              handleWrong();
            }
          });
          list.appendChild(b);
        });
        body.appendChild(list);
      }

      /* --- несколько вариантов --- */
      else if (q.type === 'multi-choice') {
        var chosen = {};
        var listM = el('div', 'cp-q-options');
        (q.options || []).forEach(function (opt, i) {
          var b = el('button', 'cp-q-option cp-q-check', '<span class="cp-q-checkmark"></span>' + esc(opt));
          b.type = 'button';
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', function () {
            if (answeredCorrect) return;
            chosen[i] = !chosen[i];
            b.classList.toggle('is-chosen', chosen[i]);
            b.setAttribute('aria-pressed', chosen[i] ? 'true' : 'false');
            fx.click();
          });
          listM.appendChild(b);
        });
        var submit = el('button', 'cp-btn cp-btn-primary cp-q-submit', 'Ответить');
        submit.type = 'button';
        function gradeMulti() {
          if (answeredCorrect) return;
          var sel = Object.keys(chosen).filter(function (k) {
            return chosen[k];
          }).map(Number);
          var correct = (q.correct || []).slice().sort(function (a, b) {
            return a - b;
          });
          var same = sel.length === correct.length && sel.every(function (v, idx) {
            return v === correct[idx];
          });
          if (same) {
            Array.prototype.forEach.call(listM.children, function (c, i) {
              if (chosen[i]) c.classList.add('is-correct');
            });
            submit.disabled = true;
            handleCorrect();
          } else {
            handleWrong();
          }
        }
        submit.addEventListener('click', gradeMulti);
        body.appendChild(listM);
        body.appendChild(submit);
      }

      /* --- вписать ответ --- */
      else if (q.type === 'text-input') {
        var row = el('div', 'cp-q-input-row');
        var input = document.createElement('input');
        input.className = 'cp-q-input';
        input.type = 'text';
        input.placeholder = q.placeholder || 'Напиши ответ';
        input.setAttribute('autocomplete', 'off');
        var go = el('button', 'cp-btn cp-btn-primary', 'Ответить');
        go.type = 'button';
        function gradeText() {
          if (answeredCorrect) return;
          var val = normalizeAnswer(input.value);
          var ok = (q.answers || []).some(function (a) {
            return normalizeAnswer(a) === val;
          });
          if (ok) {
            input.disabled = true;
            go.disabled = true;
            handleCorrect();
          } else {
            input.classList.add('is-wrong');
            setTimeout(function () {
              input.classList.remove('is-wrong');
            }, 600);
            handleWrong();
          }
        }
        go.addEventListener('click', gradeText);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') gradeText();
        });
        row.appendChild(input);
        row.appendChild(go);
        body.appendChild(row);
      }

      return {
        box: box,
        isAnsweredCorrectly: function () {
          return answeredCorrect;
        },
      };
    }

    /* ======================= Видеослайд с точками останова ================= */

    function renderVideo(slide) {
      var box = el('div', 'cp-card cp-video-card');
      var heading = el('h2', 'cp-slide-title', esc(slide.title || ''));
      box.appendChild(heading);

      var wrap = el('div', 'cp-video-wrap');
      var video = document.createElement('video');
      var videoItem = media[slide.videoId];
      if (videoItem) video.src = videoItem.src;
      video.controls = true;
      video.preload = 'metadata';
      if (slide.posterId && media[slide.posterId]) video.poster = media[slide.posterId].src;
      wrap.appendChild(video);
      box.appendChild(wrap);

      var points = pointsOf(slide);
      var overlayOpen = false;
      var overlay = el('div', 'cp-video-overlay');
      overlay.style.display = 'none';
      wrap.appendChild(overlay);

      function taskId(p) {
        return 'sp-' + slide.id + '-' + p.id;
      }
      function nextUnanswered() {
        for (var i = 0; i < points.length; i++) {
          if (!taskDone(taskId(points[i]))) return points[i];
        }
        return null;
      }

      function enforce() {
        var p = nextUnanswered();
        if (!p || overlayOpen) return;
        if (video.currentTime >= p.time - 0.05) {
          video.pause();
          try {
            video.currentTime = p.time;
          } catch (e) {
            /* ignore */
          }
          openQuestion(p);
        }
      }

      /** Защита от перемотки: нельзя перескочить ближайшую неотвеченную точку. */
      function guardSeek() {
        var p = nextUnanswered();
        if (!p) return;
        if (video.currentTime > p.time + 0.3) {
          video.currentTime = p.time;
        }
      }

      video.addEventListener('timeupdate', enforce);
      video.addEventListener('seeking', guardSeek);
      video.addEventListener('seeked', enforce);
      video.addEventListener('ended', enforce);
      video.addEventListener('play', function () {
        if (overlayOpen) {
          video.pause();
          return;
        }
        enforce();
      });

      function openQuestion(p) {
        overlayOpen = true;
        overlay.innerHTML = '';
        overlay.style.display = 'flex';

        var qCtrl = mountQuestion(p.question, {
          continueLabel: 'Продолжить просмотр ▶',
          retryLabel: '🔄 Посмотреть отрывок снова',
          onResult: function (correct) {
            if (correct) {
              return completeTask(taskId(p));
            }
            failAttempt(taskId(p));
            return false;
          },
          onContinue: function () {
            closeOverlay();
            video.play().catch(function () {});
          },
          onRetry: function () {
            closeOverlay();
            var seekBack = typeof p.seekBack === 'number' ? p.seekBack : 15;
            video.currentTime = Math.max(0, p.time - seekBack);
            video.play().catch(function () {});
          },
        });
        overlay.appendChild(qCtrl.box);
      }

      function closeOverlay() {
        overlayOpen = false;
        overlay.style.display = 'none';
        overlay.innerHTML = '';
      }

      return {
        node: box,
        leave: function () {
          video.pause();
          closeOverlay();
        },
      };
    }

    /* ================== Слайд-изображение с зонами клика ==================== */

    function renderImage(slide) {
      var box = el('div', 'cp-card cp-image-card');
      box.appendChild(el('h2', 'cp-slide-title', esc(slide.title || '')));

      var item = media[slide.imageId];
      var fig = el('figure', 'cp-image-fig');
      var img = document.createElement('img');
      if (item) img.src = item.src;
      img.alt = slide.altText || item && item.name || '';
      fig.appendChild(img);

      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'cp-zones');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      fig.appendChild(svg);
      box.appendChild(fig);

      var taskId = 'img-' + slide.id;
      var done = taskDone(taskId);
      var zones = slide.zones || [];
      var correctZones = zones.filter(function (z) {
        return z.isCorrect;
      });
      var wrongClicks = 0;
      var attemptsLimit = typeof slide.attempts === 'number' ? slide.attempts : 0;
      var found = {};

      function zoneEl(z) {
        var e;
        if (z.shape === 'rect') {
          e = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          var c = z.coords;
          e.setAttribute('x', c.x);
          e.setAttribute('y', c.y);
          e.setAttribute('width', c.w);
          e.setAttribute('height', c.h);
        } else if (z.shape === 'ellipse') {
          e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          var c2 = z.coords;
          e.setAttribute('cx', c2.cx);
          e.setAttribute('cy', c2.cy);
          e.setAttribute('rx', c2.rx);
          e.setAttribute('ry', c2.ry);
        } else {
          e = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          e.setAttribute('points', (z.coords.points || [])
            .map(function (p) {
              return p.x + ',' + p.y;
            })
            .join(' '));
        }
        e.setAttribute('class', 'cp-zone');
        e.setAttribute('data-zone', z.id);
        return e;
      }

      zones.forEach(function (z) {
        var e = zoneEl(z);
        e.addEventListener('click', function () {
          onZoneClick(z, e);
        });
        svg.appendChild(e);
      });

      function markFound(el) {
        el.classList.add('cp-zone-found');
      }

      function revealAll() {
        zones.forEach(function (z) {
          if (!z.isCorrect || found[z.id]) return;
          var e = svg.querySelector('[data-zone="' + z.id + '"]');
          if (e) e.classList.add('cp-zone-reveal');
        });
      }

      function playZoneAudio(z) {
        if (z.feedbackAudioId && media[z.feedbackAudioId]) {
          var a = new Audio(srcOf(z.feedbackAudioId));
          a.play().catch(function () {});
        }
      }

      function onZoneClick(z, zoneNode) {
        if (done) return;
        if (z.isCorrect) {
          if (slide.mode === 'pick-one') {
            markFound(zoneNode);
            playZoneAudio(z);
            finishWithFeedback(z, true);
            return;
          }
          if (!found[z.id]) {
            found[z.id] = true;
            markFound(zoneNode);
            fx.correct();
            playZoneAudio(z);
            showToast('good', esc(z.feedback || 'Верно!'));
            if (Object.keys(found).length >= correctZones.length) {
              finishWithFeedback(z, true);
            }
          }
        } else {
          wrongClicks++;
          failAttempt(taskId);
          fx.wrong();
          playZoneAudio(z);
          zoneNode.classList.add('cp-zone-miss');
          setTimeout(function () {
            zoneNode.classList.remove('cp-zone-miss');
          }, 700);
          showToast('bad', esc(z.feedback || 'Не совсем! Попробуй ещё.'));
          if (attemptsLimit > 0 && wrongClicks >= attemptsLimit) {
            // Мягкий финал: показываем правильные зоны, задания засчитываем без звезды.
            revealAll();
            done = true;
            showToast('info', 'Смотри, вот правильные места! Нажимай «Далее».');
            completeTask(taskId);
          }
        }
      }

      function finishWithFeedback(z, correct) {
        done = true;
        var gotStar = completeTask(taskId);
        showToast('good', (gotStar ? '⭐ ' : '✅ ') + esc(z && z.feedback ? z.feedback : 'Здорово!'));
      }

      // Восстановление после сохранённого прогресса: показать как выполненное
      if (done) {
        correctZones.forEach(function (z) {
          var e = svg.querySelector('[data-zone="' + z.id + '"]');
          if (e) markFound(e);
        });
      }

      var ctrl = attachNarration(box, slide.narration);
      return { node: box, enter: ctrl.enter, leave: ctrl.leave };
    }

    /* ========================= SVG-слайд с анимацией ======================= */

    /** Достаёт текст SVG из data URI (base64 или urlencoded). */
    function svgTextFromUri(uri) {
      var m = /^data:[^,]*;base64,(.*)$/s.exec(uri);
      if (m) {
        var bin = atob(m[1]);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }
      var p = /^data:[^,]*,(.*)$/s.exec(uri);
      if (p) return decodeURIComponent(p[1]);
      return uri;
    }

    function renderSvg(slide) {
      var box = el('div', 'cp-card cp-svg-card');
      box.appendChild(el('h2', 'cp-slide-title', esc(slide.title || '')));

      var host = el('div', 'cp-svg-host');
      var item = media[slide.svgId];
      var svgEl = null;
      if (item) {
        try {
          host.innerHTML = svgTextFromUri(item.src);
          svgEl = host.querySelector('svg');
        } catch (e) {
          host.innerHTML = '';
        }
      }
      box.appendChild(host);

      var replayBtn = el('button', 'cp-btn cp-btn-ghost cp-svg-replay', '🔄 Проиграть заново');
      replayBtn.type = 'button';
      replayBtn.addEventListener('click', function () {
        if (!svgEl) return;
        var clone = svgEl.cloneNode(true);
        svgEl.replaceWith(clone);
        svgEl = clone;
        try {
          if (clone.setCurrentTime) clone.setCurrentTime(0);
        } catch (e) {
          /* без SMIL — клонирование уже перезапускает CSS-анимации */
        }
      });
      var bar = el('div', 'cp-svg-bar');
      bar.appendChild(replayBtn);
      box.appendChild(bar);

      if (slide.question) {
        var taskId = 'svgq-' + slide.id;
        var holder = el('div', 'cp-svg-question');
        if (taskDone(taskId)) {
          holder.appendChild(
            el('div', 'cp-question-feedback cp-feedback-good cp-feedback-show', '<p class="cp-feedback-text">✅ Задание выполнено!</p>'),
          );
        } else {
          var buildQ = function () {
            holder.innerHTML = '';
            var ctrl = mountQuestion(slide.question, {
              retryLabel: 'Попробовать ещё раз',
              onResult: function (correct) {
                if (correct) return completeTask(taskId);
                failAttempt(taskId);
                return false;
              },
              onRetry: buildQ,
            });
            holder.appendChild(ctrl.box);
          };
          buildQ();
        }
        box.appendChild(holder);
      }

      return { node: box };
    }

    /* ============================ Квиз-слайд ================================ */

    function renderQuiz(slide) {
      var box = el('div', 'cp-card cp-quiz-card');
      box.appendChild(el('h2', 'cp-slide-title', esc(slide.title || '')));

      var taskId = 'q-' + slide.id;
      var holder = el('div', 'cp-quiz-question');
      if (taskDone(taskId)) {
        holder.appendChild(
          el(
            'div',
            'cp-question-feedback cp-feedback-good cp-feedback-show',
            '<p class="cp-feedback-text">✅ Ты уже ответил на этот вопрос!</p>',
          ),
        );
      } else {
        var buildQ = function () {
          holder.innerHTML = '';
          var ctrl = mountQuestion(slide.question, {
            retryLabel: 'Попробовать ещё раз',
            onResult: function (correct) {
              if (correct) return completeTask(taskId);
              failAttempt(taskId);
              return false;
            },
            onRetry: buildQ,
          });
          holder.appendChild(ctrl.box);
        };
        buildQ();
      }
      box.appendChild(holder);
      return { node: box };
    }

    /* Финальный слайд */
    function renderFinal(slide) {
      var total = totalTasks();
      var stars = starCount();
      var percent = total > 0 ? Math.round((stars / total) * 100) : 100;
      var pass = settings.passingScorePercent != null ? settings.passingScorePercent : 70;
      var showResults = settings.showResultsAtEnd !== false;

      var box = el('div', 'cp-card cp-final-card');

      var msg;
      if (total === 0 || percent >= 100) msg = 'Вау! Все звёзды твои! Ты справился блестяще! 🌟';
      else if (percent >= pass) msg = 'Отличный результат! Ты настоящий знаток! 🎉';
      else msg = 'Ты большой молодец! Попробуешь ещё раз и соберёшь ещё больше звёзд? 💪';

      var html = '<div class="cp-final-inner">';
      html += '<div class="cp-final-trophy">🏆</div>';
      html += '<h1 class="cp-final-title">' + esc(slide.title || 'Молодец!') + '</h1>';
      if (showResults && total > 0) {
        html += '<div class="cp-final-stars">';
        for (var i = 0; i < total; i++) html += '<span class="cp-final-star' + (i < stars ? ' is-earned' : '') + '">★</span>';
        html += '</div>';
        html += '<div class="cp-final-score">Звёзды: ' + stars + ' из ' + total + ' (' + percent + '%)</div>';
      }
      html += '<p class="cp-final-msg">' + esc(msg) + '</p>';
      if (slide.praise) html += '<p class="cp-final-praise">' + esc(slide.praise) + '</p>';
      html += '<button type="button" class="cp-btn cp-btn-primary" data-act="again">Пройти заново</button>';
      html += '</div>';
      box.innerHTML = html;

      state.finished = true;
      store.save(state);

      box.querySelector('[data-act="again"]').addEventListener('click', function () {
        fx.unlock();
        state = newState();
        store.clear();
        hasProgress = false;
        saved = null;
        goTo(0);
      });
      return { node: box };
    }

    /* --------------------------------- Старт ------------------------------- */

    goTo(clamp(options.startAt || 0, 0, slides.length - 1));

    return {
      destroy: function () {
        destroyed = true;
        document.removeEventListener('keydown', keydown);
        if (current && current.leave) current.leave();
        shell.remove();
      },
      goTo: goTo,
    };
  }

  window.CoursePlayer = { mount: mount, version: '1.0' };
})();

</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('course-data').textContent);
  CoursePlayer.mount(document.getElementById('course-app'), data, {});
})();
</script>
