<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081712">
<title>Папки для офиса</title>
<style>
:root{
  --bg:#081712; --bg2:#0C211A; --line:#ffffff1f; --ink:#EAF5EC; --dim:#A9C4B2;
  --moss:#35C46F; --mint:#06D6A0; --amber:#FFB347; --amber-hi:#FFD166;
  --sky:#38BDF8; --coral:#EF476F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --u:5.2cqw;            /* базовая единица типографики: % ширины сцены,
                            поэтому композиция одинакова при 360 и 1080 px */
  --font:system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{display:grid;place-items:center;font-family:var(--font);color:var(--ink)}

/* ---------- сцена 9:16 ---------- */
#stage{
  position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));
  background:radial-gradient(120% 70% at 50% -10%,#123128 0%,transparent 62%),var(--bg);
  overflow:hidden;user-select:none;display:flex;flex-direction:column;
  container-type:size;container-name:stage;
  padding:calc(var(--sat) + 3%) 4.6% calc(var(--sab) + 2.4%);gap:2%;
  box-shadow:0 0 0 1px #ffffff10;
}
#progress{position:absolute;top:0;left:0;right:0;height:4px;background:#ffffff14}
#bar{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--moss),var(--sky))}
#bar .cue{position:absolute;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--amber-hi);transform:translateX(-50%)}

.slot{position:relative;width:100%}
#slotTop{height:11%}
#slotCond{height:15%;margin-top:.5%}   /* чуть ниже заглавия — воздух между строками тайтла и плашкой */
#slotMid{flex:1 1 auto;min-height:0}
#slotBottom{height:6%}
/* шапка/условие/подвал — фиксированные: длинная плашка не должна сжимать соседние слоты */
#slotTop,#slotCond,#slotBottom{flex:none}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;visibility:hidden;will-change:opacity}
.layer.fill{align-items:stretch}
/* содержимое слоя всегда занимает кадр целиком: иначе flex-дети сжимаются в узкую колонку
   и подписи/числа ломаются на строки */
.layer > .body{width:100%;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:.4em}
/* height:100% только у «растянутых» примитивов: у текста/числа бокс должен быть по контенту,
   иначе он перекрывает соседние слои и проверки на наезд врут */
.layer.fill > .body{height:100%;align-items:stretch}
/* zone: кадр делится на две половины — сверху формула, снизу схема (растут синхронно) */
.layer[data-zone="upper"]{bottom:43%}
.layer[data-zone="lower"]{top:57%}

/* ---------- примитивы ---------- */
.t-title{font-weight:900;font-size:6.8cqw;line-height:1.16;text-align:center;
  background:linear-gradient(100deg,var(--amber-hi) 10%,var(--amber) 45%,var(--mint) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.t-text{font-weight:600;font-size:var(--u);line-height:1.35;text-align:center;color:var(--dim)}
.t-text b{color:var(--amber-hi)} .t-text i{color:var(--mint);font-style:normal;font-weight:800}
.card{background:#0c211acc;border:1px solid var(--line);border-radius:14px;padding:.6em .8em;width:100%}
/* плашка условия — блок, не флекс: иначе каждая помеченная фраза (<b>/<i>)
   становится отдельной строкой-флекс-итемом, плашка раздувается и наезжает на заглавие */
.body.card{display:block;text-align:center}

.f-formula{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.22em;width:100%}
.f-formula .fs{font-weight:800;font-size:7.4cqw;line-height:1.12;max-width:100%;
  text-align:center;text-wrap:balance;opacity:0}
.f-formula .fs b{color:var(--mint)} .f-formula .fs em{color:var(--amber-hi);font-style:normal}
.f-formula .fs s{color:var(--coral);opacity:.75}
.f-formula .fs.hl{background:#FFB34722;border-radius:8px;padding:.1em .3em}
.f-sub{margin-top:.5em;font-size:5.4cqw;font-weight:700;line-height:1.25;color:var(--dim);
  text-align:center;max-width:100%;opacity:0}
.f-sub b{color:var(--amber-hi)}

/* шаг-вспышка: акцентная плашка под заглавием. In/hold/out считаются из render(t)
   (появление с лёгким ростом, чтение, исчезновение с лёгким уменьшением) */
.f-flash{max-width:100%;padding:.5em 1.1em;border-radius:999px;
  background:linear-gradient(120deg,#ffb3472e,#06d6a020);border:1px solid #ffd1664d;
  font-weight:800;font-size:4.7cqw;line-height:1.25;color:var(--amber-hi);
  text-align:center;will-change:transform,opacity}
.f-flash i{color:var(--mint);font-style:normal}

.n-axis{width:100%;height:100%;display:block}
.n-leg{font-size:clamp(11px,1.7vh,14px);fill:#BFD8C6;font-weight:700;font-family:var(--font)}

.g-table{display:grid;width:100%;gap:2px;border-radius:12px;overflow:hidden;background:#0c211acc}
.g-table .cell{padding:.6em .4em;font-size:4.3cqw;font-weight:700;text-align:center;
  background:#0c211a;opacity:0;transition:none}
.g-table .head .cell{color:var(--dim);font-size:3.7cqw;font-weight:800;letter-spacing:.02em}
.g-table .cell.q{color:var(--amber-hi)}
.g-table .cell.on{background:#06d6a01f;color:var(--mint)}
.g-table .cell.same{color:var(--sky)}

.b-bars{width:100%;display:flex;flex-direction:column;gap:.5em}
.b-row{display:flex;align-items:center;gap:.5em}
.b-row .lab{flex:0 0 30%;font-size:4.4cqw;font-weight:800;color:var(--dim);text-align:right}
.b-track{flex:1;height:11cqw;background:#ffffff0d;border-radius:8px;overflow:hidden}
.b-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--moss),var(--mint))}
.b-row .val{flex:0 0 26%;font-size:4.9cqw;font-weight:800;color:var(--ink)}

.c-count{font-weight:900;font-size:18cqw;color:var(--mint);text-align:center}

.tanks{display:flex;gap:5cqw;width:100%;align-items:flex-end;justify-content:center}
.tank{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:.5em;max-width:72%;min-width:0}
.tank .cap{font-size:4cqw;font-weight:800;color:var(--dim);text-align:center;line-height:1.15;white-space:nowrap}
.tank .jar{position:relative;width:100%;height:var(--jar,52cqw);border:1.1cqw solid #ffffff2b;border-radius:2.6cqw;
  background:#ffffff08;overflow:hidden;display:flex;align-items:flex-end}
.tank .water{width:100%;height:0;background:linear-gradient(180deg,#38BDF8,#118AB2);opacity:.9}
.tank .lvl{position:absolute;inset:0;display:grid;place-items:center;font-size:5.4cqw;white-space:nowrap;
  font-weight:900;color:var(--ink);text-shadow:0 .2cqw .7cqw #000a}
.tank .sub{font-size:3.7cqw;font-weight:700;color:var(--mint);text-align:center;white-space:nowrap}
.tank.hot .jar{border-color:#06d6a066} .tank.hot .sub{color:var(--amber-hi)}

/* ---------- титры / квиз / оверлеи ---------- */
/* Титры — отдельная строка флекс-колонки, а не absolute: иначе при крупных кеглях
   они наезжают на сцену. Высота зарезервирована всегда (opacity, не display),
   поэтому кадр не «прыгает», когда титр пропадает. */
#caption{flex:0 0 auto;min-height:9cqw;display:flex;align-items:center;justify-content:center;
  z-index:7;background:rgba(6,17,13,.86);border:1px solid var(--line);border-radius:12px;
  padding:.6em .9em;font-size:4.6cqw;font-weight:600;line-height:1.3;
  text-align:center;opacity:0;transition:opacity .25s}
#caption.show{opacity:1}
#caption .k{color:var(--amber-hi);font-weight:800}

#quiz{position:absolute;left:4.2%;right:4.2%;bottom:calc(var(--sab) + 2.4%);z-index:9;display:none;
  flex-direction:column;gap:.5em;background:rgba(8,23,18,.97);border:1px solid var(--line);
  border-radius:16px;padding:.8em;box-shadow:0 20px 60px #000a}
#quiz.show{display:flex}
#qtext{font-size:6cqw;font-weight:800;line-height:1.28}
#answers{display:flex;flex-direction:column;gap:.45em}
#answers button{min-height:max(56px,15cqw);border-radius:12px;border:1px solid #ffffff2b;background:#123128;
  color:var(--ink);font:800 var(--u)/1.2 var(--font);padding:.5em .7em;text-align:left;cursor:pointer}
#answers button.ok{background:#06d6a033;border-color:var(--mint);color:var(--mint)}
#answers button.bad{background:#ef476f2b;border-color:var(--coral);color:var(--coral)}
#feedback{font-size:3.9cqw;font-weight:700;color:var(--dim);min-height:1.2em}

/* ---------- озвучка ---------- */
/* одна дорожка, разложенная по шкале урока: seek по clock, пауза на вопросе/паузе,
   откат после ошибки переигрывает объяснение с места rewind */
#voice{display:none}
#soundBtn{position:absolute;top:calc(var(--sat) + 1.1%);right:2%;z-index:12;display:none;
  width:max(44px,10.5cqw);height:max(44px,10.5cqw);border-radius:50%;
  border:1px solid var(--line);background:#0c211acc;color:var(--ink);
  font-size:4.6cqw;line-height:1;align-items:center;justify-content:center;cursor:pointer}
#soundBtn.show{display:flex}

.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;
  gap:1em;padding:8%;background:linear-gradient(180deg,#081712f2,#081712f8);text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:8.2cqw;font-weight:900;line-height:1.1}
.overlay p{font-size:var(--u);color:var(--dim);font-weight:600;line-height:1.4}
.overlay .bigbtn{min-height:max(56px,15cqw);border:0;border-radius:14px;background:linear-gradient(120deg,var(--amber-hi),var(--amber));
  color:#081712;font:900 var(--u)/1 var(--font);padding:.8em 1em;cursor:pointer}
.badge{font-size:3.6cqw;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--moss)}
</style>
</head>
<body>
<div id="stage">
  <div id="progress"><i id="bar"></i></div>
  <audio id="voice" preload="auto" playsinline></audio>
  <button id="soundBtn" type="button" aria-label="Звук вкл/выкл">🔊</button>
  <div class="slot" id="slotTop"></div>
  <div class="slot" id="slotCond"></div>
  <div class="slot" id="slotMid"></div>
  <div class="slot" id="slotBottom"></div>

  <div id="caption" aria-live="polite"></div>

  <div id="quiz">
    <div id="qtext"></div>
    <div id="answers"></div>
    <div id="feedback"></div>
  </div>

  <div class="overlay" id="start">
    <div class="badge" id="startBadge"></div>
    <h1 id="startTitle"></h1>
    <p id="startText"></p>
    <button class="bigbtn" id="startBtn">▶ Начать</button>
  </div>

  <div class="overlay hidden" id="end">
    <div class="badge">разбор пройден</div>
    <h1 id="endTitle">Готово</h1>
    <div id="stars" style="font-size:8.5cqw;color:var(--amber-hi)"></div>
    <p id="stats"></p>
    <button class="bigbtn" id="againBtn">↺ Ещё раз</button>
    <button class="bigbtn" id="reviewBtn" style="background:#123128;color:var(--ink);border:1px solid #ffffff2b">Смотреть без вопросов</button>
  </div>
</div>

MAAAFkAAABcQAAAWAAAAFhAAABZwAAAWYAAAFsAAABbAAAAWMAAAFmAAABXgAAAWYAAAFfAAABZQAAAy0AAAJnAAACJAAAAlAAAAJ8AAACyAAAArUAAAKMAAACPQAAAhQAAAIeAAAB9AAAAbgAAAGAAAABgQAAAXsAAAFkAAABZwAAAaEAAAKaAAACiAAAAooAAAKsAAACagAAAkMAAAKyAAAClwAAAj0AAAJzAAACgQAAAlAAAAK3AAAClwAAAqcAAAIRAAAC0QAAAhgAAAHRAAABogAAAZEAAAF2AAABcAAAAVgAAAFqAAABbQAAAW0AAAGgAAACsQAAApQAAAKWAAACoAAAAkwAAAI5AAACFgAAAdMAAAF7AAAC7wAAAbcAAAGvAAABfAAAAX0AAAIIAAACpwAAAqIAAAKtAAACPAAAAa4AAAF+AAABcwAAAV8AAAFtAAABagAAAWkAAAFvAAABbgAAAW4AAAFdAAABZQAAAWcAAAFvAAABmwAAAYsAAAGEAAABeQAAAaUAAAF9AAABdAAAAZ4AAAGmAAABegAAAXwAAAGBAAABbwAAAakAAAF6AAABZwAAAX4AAAGAAAABkwAAAAQAAAAEAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAABAAAAAQAAAAEAAAABAAAAswAAAICAAADGQAAAmoAAAKJAAACqgAAAhAAAAJMAAACWQAAAg8AAAG6AAABXwAAAU8AAAM1AAABjQAAAW8AAAFQAAABSQAAAUAAAAFIAAABQQAAAUcAAAFFAAABUQAAATsAAAFEAAABSAAAAUoAAAGHAAABygAAAiIAAAHJAAACIwAAAn4AAAKkAAACqAAAAq4AAAH2AAABewAAAVkAAANCAAABtgAAAdUAAAKbAAACpQAAArcAAAKNAAACnQAAAggAAAHiAAABxQAAAYYAAAFfAAADMAAAAYsAAAGlAAABywAAAmAAAAKeAAACogAAAqYAAAKoAAACGAAAAY4AAAFjAAABVAAAAXgAAAFqAAABZQAAAWkAAAFqAAABaQAAAyQAAAHwAAABkQAAApoAAAKDAAACoAAAAqIAAAKtAAACnwAAAm4AAAHmAAADPQAAApEAAAKWAAACkgAAAocAAAIMAAAByAAAAcEAAAJtAAACcAAAAcsAAAHdAAABxgAAAXoAAAFuAAABZgAAAWYAAAFkAAABcAAAAWUAAAFpAAABXgAAAWUAAAFmAAABaAAAAWcAAAFkAAADIAAAAhcAAAGgAAAC8QAAAegAAAHmAAAB5gAAAdkAAAG1AAABagAAAugAAAGpAAABcQAAAVoAAAFoAAABWwAAAWIAAAFnAAABYwAAAe0AAAKdAAACnQAAApkAAAKFAAACGAAAAe4AAAHFAAABiwAAAWgAAAMwAAABjwAAAagAAAGtAAACNQAAApQAAAKeAAACuQAAAq4AAAH5AAABsgAAAYwAAAFvAAABdwAAA0wAAAIGAAAB2wAAAh8AAALBAAACkQAAAsIAAAH/AAAB9AAAAcMAAAGMAAABigAAAWEAAALlAAABsgAAAbMAAAGEAAABiAAAAu0AAAFwAAABeQAAAvQAAAHZAAABdAAAAWwAAAFlAAABYwAAAWQAAAF7AAAAFHN0Y28AAAAAAAAAAQAAACwAAAAac2dwZAEAAAByb2xsAAAAAgAAAAH//wAAABxzYmdwAAAAAHJvbGwAAAABAAAFGQAAAAEAAABidWR0YQAAAFptZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAC1pbHN0AAAAJal0b28AAAAdZGF0YQAAAAEAAAAATGF2ZjYyLjEyLjEwMg=="
  }
};
const SLOTS = {top:"slotTop", cond:"slotCond", mid:"slotMid", bottom:"slotBottom"};
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const P = (t,a,d)=> d > 0 ? clamp((t-a)/d,0,1) : (t >= a ? 1 : 0);
const S = x => x*x*(3-2*x);
const NUMS = n => String(n).replace(".", ",");

/* ============ анимации-примитивы: чистая функция времени ============ */
const PRIM = {
  title:{
    build(L){ L.body.className = "body t-title"; L.body.innerHTML = L.def.text || ""; },
    update(){}
  },
  text:{
    build(L){ L.body.className = "body t-text " + (L.def.cls || ""); L.body.innerHTML = L.def.html || ""; },
    update(){}
  },
  card:{
    build(L){
      L.body.className = "body card t-text";
      L.body.innerHTML = L.def.html || "";
    },
    update(){}
  },
  formula:{
    build(L){
      L.body.className = "body fill";
      const w = document.createElement("div"); w.className = "f-formula";
      L.steps = (L.def.steps || []).map(st=>{
        const s = document.createElement("span");
        s.className = "fs" + (st.hl ? " hl" : "");
        s.innerHTML = st.html;
        /* size: кегль в % ширины сцены — короткие строки можно показывать крупнее */
        if(L.def.size) s.style.fontSize = L.def.size + "cqw";
        w.appendChild(s);
        return {el:s, st};
      });
      if(L.def.sub){
        L.sub = document.createElement("div");
        L.sub.className = "f-sub";
        L.sub.innerHTML = L.def.sub;
        w.appendChild(L.sub);
      }
      L.body.appendChild(w);
    },
    update(L,t){
      L.steps.forEach(({el,st})=>{
        let o = S(P(t, st.at, st.d == null ? .35 : st.d));
        if(st.until != null) o *= 1 - S(P(t, st.until, .3));
        el.style.opacity = o;
      });
      if(L.sub) L.sub.style.opacity = S(P(t, (L.steps[0]?.st.at ?? 0) + .5, .45));
    }
  },
  numberline:{
    build(L){
      const d = L.def, min = d.min??0, max = d.max??10;
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag,attrs,parent)=>{
        const e = document.createElementNS(NS,tag);
        for(const k in attrs) e.setAttribute(k, attrs[k]);
        if(parent) parent.appendChild(e);
        return e;
      };
      L.body.className = "body fill";
      const svg = el("svg",{class:"n-axis",viewBox:"0 0 900 260",preserveAspectRatio:"xMidYMid meet"});
      L.body.appendChild(svg);
      const X0 = 60, X1 = 840, Y = 150;
      const x = v => X0 + (v - min) / (max - min) * (X1 - X0);
      el("line",{x1:X0,y1:Y,x2:X1,y2:Y,stroke:"#3E5C4A","stroke-width":5},svg);
      const step = d.step ?? 1;
      for(let v = min; v <= max + 1e-9; v += step){
        const big = Math.abs(v % (d.labelStep ?? step)) < 1e-9;
        el("line",{x1:x(v),y1:Y,x2:x(v),y2:Y + (big?20:11),stroke:"#7FA08C","stroke-width":big?5:3},svg);
        if(big){
          const tx = el("text",{x:x(v),y:Y+56,"text-anchor":"middle",fill:"#BFD8C6","font-size":44,
            "font-family":"system-ui,sans-serif","font-weight":700},svg);
          tx.textContent = NUMS(v) + (d.unit ? " " + d.unit : "");
        }
      }
      L.segs = (d.segments || []).map(sg=>{
        const g = el("g",{opacity:0},svg);
        const y2 = sg.side === "down" ? Y + 64 : Y - 56;
        el("line",{x1:x(sg.from),y1:Y,x2:x(sg.to),y2:Y,stroke:sg.color || "#FFB347","stroke-width":20,
          "stroke-linecap":"round",opacity:.85},g);
        el("line",{x1:x(sg.from),y1:Y,x2:x(sg.from),y2:y2,stroke:sg.color || "#FFB347","stroke-width":4,opacity:.5},g);
        el("line",{x1:x(sg.to),y1:Y,x2:x(sg.to),y2:y2,stroke:sg.color || "#FFB347","stroke-width":4,opacity:.5},g);
        if(sg.label){
          const lx = (x(sg.from) + x(sg.to)) / 2;
          const tx = el("text",{x:lx,y: sg.side === "down" ? Y + 104 : Y - 64,"text-anchor":"middle",
            fill:sg.color || "#FFD166","font-size":50,"font-family":"system-ui,sans-serif","font-weight":800},g);
          tx.textContent = sg.label;
        }
        return {g, sg};
      });
      const mg = el("g",{opacity:0},svg);
      L.marker = {g:mg,
        dot: el("circle",{cx:X0,cy:Y-46,r:34,fill:"#0891a2",stroke:"#0b2a22","stroke-width":5},mg),
        txt: el("text",{x:X0,y:Y-34,"text-anchor":"middle",fill:"#081712","font-size":36,
          "font-family":"system-ui,sans-serif","font-weight":900},mg)};
      L.x = x; L.base = {X0, X1, Y};
    },
    update(L,t){
      L.segs.forEach(({g,sg})=>{
        g.setAttribute("opacity", S(P(t, sg.at ?? 0, sg.d ?? .4)) * (sg.until != null ? 1 - S(P(t, sg.until, .3)) : 1));
      });
      const m = L.def.marker;
      if(!m) return;
      const a = m.at ?? 0, b = m.until ?? a + 1.2;
      const p = S(P(t, a, b - a));
      const v = (m.from ?? L.def.min) + ((m.to ?? m.from ?? L.def.min) - (m.from ?? L.def.min)) * p;
      const vis = S(P(t, a, .3)) * (m.hideAt != null ? 1 - S(P(t, m.hideAt, .3)) : 1);
      L.marker.g.setAttribute("opacity", vis);
      const cx = L.x(v);
      L.marker.dot.setAttribute("cx", cx);
      L.marker.txt.setAttribute("x", cx);
      L.marker.txt.textContent = m.label != null ? (typeof m.label === "string" ? m.label : NUMS(v)) : NUMS(v);
    }
  },
  table:{
    build(L){
      const d = L.def;
      L.body.className = "body fill";
      const g = document.createElement("div");
      g.className = "g-table";
      g.style.gridTemplateColumns = `repeat(${d.cols.length},1fr)`;
      const mkRow = (cells, cls) => cells.map(c=>{
        const cell = document.createElement("div");
        cell.className = "cell " + (cls || "") + (c.q ? " q" : "") + (c.cls ? " " + c.cls : "");
        cell.innerHTML = c.v ?? "";
        g.appendChild(cell);
        return {el:cell, c};
      });
      L.rows = (d.rows || []).map((r,i)=> mkRow(r.cells, i === 0 && d.head !== false ? "head" : ""));
      L.head = L.rows[0] || [];
      L.body.appendChild(g);
    },
    update(L,t){
      L.rows.forEach(row=>{
        row.forEach(({el,c})=>{
          el.style.opacity = S(P(t, c.at ?? 0, .3));
          /* ячейка «?» с подстановкой ответа: v -> then в момент thenAt */
          if(c.thenAt != null){
            const revealed = t >= c.thenAt;
            el.innerHTML = revealed ? c.then : c.v;
            el.classList.toggle("on", revealed);
            el.classList.toggle("q", !revealed && !!c.q);
          }
        });
      });
    }
  },
  bars:{
    build(L){
      const d = L.def, max = d.max ?? Math.max(...d.items.map(i=>i.value));
      L.body.className = "body fill";
      const w = document.createElement("div"); w.className = "b-bars";
      L.items = d.items.map(it=>{
        const row = document.createElement("div"); row.className = "b-row";
        row.innerHTML = `<div class="lab">${it.label}</div>
          <div class="b-track"><div class="b-fill" style="background:${it.color || "linear-gradient(90deg,#35C46F,#06D6A0)"}"></div></div>
          <div class="val"></div>`;
        w.appendChild(row);
        return {row, it, fill: row.querySelector(".b-fill"), val: row.querySelector(".val")};
      });
      L.body.appendChild(w); L.max = max;
    },
    update(L,t){
      L.items.forEach(({row,it,fill,val})=>{
        const p = S(P(t, it.at ?? 0, it.d ?? .6));
        fill.style.width = (it.value / L.max * 100 * p).toFixed(2) + "%";
        val.textContent = p > .05 ? (it.note != null ? it.note : NUMS(+(it.value * p).toFixed(2))) : "";
        row.style.opacity = S(P(t, (it.at ?? 0) - .1, .25));
      });
    }
  },
  counter:{
    build(L){ L.body.className = "body c-count"; L.body.textContent = ""; },
    update(L,t){
      const d = L.def, a = d.at ?? 0, b = d.until ?? a + 1;
      const p = S(P(t, a, b - a));
      const v = (d.from ?? 0) + ((d.to ?? 10) - (d.from ?? 0)) * p;
      L.body.textContent = NUMS(+(v.toFixed(d.dec ?? 0))) + (d.suffix || "");
    }
  },
  /* flash: медленная вспышка-акцент (отсчёт шагов алгоритма). Появляется с ростом
     до пика, читается на спаде и растворяется в ноль — не висит до смены кадра.
     peak/life настраиваются в спеке. Чистая функция времени — пауза квиза,
     откат и покадровая съёмка корректны. */
  flash:{
    build(L){
      L.body.className = "body";
      const p = document.createElement("div");
      p.className = "f-flash";
      p.innerHTML = L.def.html || L.def.text || "";
      L.pill = p;
      L.body.appendChild(p);
      /* собственные конверты плашки делают слойную прозрачность почти мгновенной */
      if(L.def.fade == null) L.def.fade = 0.06;
    },
    update(L,t){
      const a = (L.def.t || [0, 0])[0];
      const IN = .9;                       // взлёт: рост + появление
      const peak = L.def.peak ?? 1.3;      // насколько раздувается
      const life = L.def.life ?? 3.4;      // полная жизнь от появления
      const pin = S(P(t, a, IN));
      const out = S(P(t, a + IN, life - IN));
      /* 0.92 → peak (взлёт) → распад до 0.9 и нуля — пропадает совсем */
      const scale = 0.92 + (peak - 0.92) * pin - (peak - 0.9) * out;
      L.pill.style.opacity = (pin * (1 - out)).toFixed(3);
      L.pill.style.transform = `scale(${scale.toFixed(3)})`;
    }
  },
  /* tank: ёмкости, наполняющиеся с разной скоростью — «за минуту столько-то литров».
     Уровень и подпись считаются от t, поэтому откат и покадровая съёмка корректны. */
  tank:{
    build(L){
      L.body.className = "body fill";
      const w = document.createElement("div"); w.className = "tanks";
      L.tanks = (L.def.items || []).map(it=>{
        const d = document.createElement("div");
        d.className = "tank" + (it.hot ? " hot" : "");
        if(L.def.jarH) d.style.setProperty("--jar", L.def.jarH + "cqw");
        d.dataset.cap = it.cap ?? (it.to || 1);
        d.innerHTML = '<div class="cap">' + (it.label || "") + '</div>' +
                      '<div class="jar"><div class="water"></div><div class="lvl"></div></div>' +
                      '<div class="sub">' + (it.sub || "") + '</div>';
        w.appendChild(d);
        return {it, water:d.querySelector(".water"), lvl:d.querySelector(".lvl")};
      });
      L.body.appendChild(w);
    },
    update(L,t){
      L.tanks.forEach(({it,water,lvl})=>{
        const a = it.at ?? 0, b = it.until ?? a + 1;
        const p = S(P(t, a, b - a));
        const v = (it.from ?? 0) + ((it.to ?? 100) - (it.from ?? 0)) * p;
        /* уровень воды — ЗНАЧЕНИЕ, а не время: иначе бак с «?» (from=to=0) наливался полностью */
        const cap = it.cap ?? (it.to || 1);
        const frac = cap > 0 ? clamp(v / cap, 0, 1) : 0;
        water.style.height = (frac * 100).toFixed(2) + "%";
        water.dataset.v = +v.toFixed(2);
        const rv = +(v.toFixed(it.dec ?? 0));
        /* sep: разряды тонким пробелом (60 000 л читается, 60000 — нет) */
        const txt = it.sep ? String(rv).replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009") : NUMS(rv);
        lvl.textContent = (it.readout || "{v}").replace("{v}", txt);
      });
    }
  }
};

/* ============ слои, титры, прогресс ============ */
const layers = [];
function boot(){
  $("startTitle").textContent = SPEC.title || "Урок";
  $("startBadge").textContent = SPEC.badge || "";
  $("startText").innerHTML = SPEC.intro || "";
  $("endTitle").textContent = SPEC.outroTitle || "Готово";
  document.title = SPEC.title || "Урок";

  (SPEC.layers || []).forEach(def=>{
    const slot = $(SLOTS[def.slot] || "slotMid");
    const el = document.createElement("div");
    /* префикс layer- : имена примитивов (tank, card, bars) не должны цеплять CSS слоя */
    el.className = "layer layer-" + def.type;
    if(def.zone) el.dataset.zone = def.zone;
    if(["formula","numberline","table","bars","tank"].includes(def.type)) el.classList.add("fill");
    const body = document.createElement("div");
    el.appendChild(body);
    slot.appendChild(el);
    const L = {el, body, def};
    (PRIM[def.type] || PRIM.text).build(L);
    layers.push(L);
  });

  (SPEC.cues || []).forEach(c=>{ c.done = false; c.tries = 0;
    const m = document.createElement("i"); m.className = "cue";
    m.style.left = (c.t / SPEC.duration * 100) + "%";
    $("bar").appendChild(m); c.mark = m; });
}

function render(t){
  layers.forEach(L=>{
    const a = (L.def.t || [0, SPEC.duration])[0], b = (L.def.t || [0, SPEC.duration])[1];
    const d = L.def.fade ?? .45;
    const vis = S(P(t,a,d)) * (1 - S(P(t,b,d)));
    L.el.style.opacity = vis;
    L.el.style.visibility = vis <= .01 ? "hidden" : "visible";
    if(vis > .01) (PRIM[L.def.type] || PRIM.text).update(L, t);
  });

  if(ccOn && mode !== "quiz"){
    const line = (SPEC.captions || []).find(c=>t >= c.a && t < c.b);
    const cap = $("caption");
    if(line){ if(cap.dataset.k !== line.t){ cap.innerHTML = line.t; cap.dataset.k = line.t; } cap.classList.add("show"); }
    else { cap.classList.remove("show"); cap.dataset.k = ""; }
  } else $("caption").classList.remove("show");

  $("bar").style.width = (t / SPEC.duration * 100) + "%";
}

/* ============ состояние, вопросы, управление ============ */
let mode = "idle", clock = 0, speed = 1, ccOn = true, review = false, firstTry = 0, prevMode = "play";
const CUES = SPEC.cues || [];

/* ============ озвучка: одна дорожка на шкале урока ============ */
/* Дорожка собрана narrate.py по абсолютным временам урока, поэтому звук seeking'ся
   напрямую по clock: пауза на вопросе/паузе, откат после ошибки переигрывает
   объяснение с места rewind. В ?review=1 (съёмка кадров) звук отключён целиком. */
const VOICE = (SPEC.voice && !new URLSearchParams(location.search).has("review")) ? $("voice") : null;
if(VOICE) VOICE.src = SPEC.voice.src;   /* data:audio/mp4;base64,… — вшит сборкой */
let voiceOn = true;
try{ voiceOn = (localStorage.getItem("lesson:" + (SPEC.id || "x") + ":sound") ?? "1") === "1"; }catch(e){}

function syncVoice(){
  if(!VOICE) return;
  const active = voiceOn && (mode === "play" || mode === "replay");
  if(active){
    const want = Math.min(clock, VOICE.duration || clock);
    if(VOICE.paused){
      if(Math.abs(VOICE.currentTime - clock) > 0.3) VOICE.currentTime = want;
      VOICE.play().catch(()=>{});
    }else if(Math.abs(VOICE.currentTime - clock) > 0.35){
      VOICE.currentTime = want;
    }
  }else if(!VOICE.paused){
    VOICE.pause();
  }
}
function applySoundBtn(){
  if(!VOICE) return;
  $("soundBtn").classList.add("show");
  $("soundBtn").textContent = voiceOn ? "🔊" : "🔇";
}
$("soundBtn").onclick = ()=>{
  if(!VOICE) return;
  voiceOn = !voiceOn;
  try{ localStorage.setItem("lesson:" + (SPEC.id || "x") + ":sound", voiceOn ? "1" : "0"); }catch(e){}
  applySoundBtn();
  if(!voiceOn && !VOICE.paused) VOICE.pause();
  tgHaptic("select");
};

function openQuiz(cue){
  mode = "quiz"; clock = cue.t;
  $("qtext").textContent = cue.q;
  const box = $("answers"); box.innerHTML = "";
  cue.a.forEach((label,i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.onclick = ()=>answer(cue,i,b);
    box.appendChild(b);
  });
  $("feedback").textContent = "Выбери ответ"; $("feedback").style.color = "var(--dim)";
  $("quiz").classList.add("show");
  tgHaptic("select");
}
function answer(cue,i,btn){
  [...$("answers").children].forEach(b=>b.disabled = true);
  cue.tries++;
  if(i === cue.ok){
    btn.classList.add("ok");
    if(cue.tries === 1) firstTry++;
    cue.done = true; cue.mark.classList.add("done");
    $("feedback").textContent = "Верно! Продолжаем ▶"; $("feedback").style.color = "var(--mint)";
    tgHaptic("ok");
    setTimeout(()=>{ $("quiz").classList.remove("show"); mode = "play"; }, 820);
  }else{
    btn.classList.add("bad");
    $("feedback").textContent = "Ошибка — вернёмся к объяснению ↺"; $("feedback").style.color = "var(--coral)";
    tgHaptic("bad");
    setTimeout(()=>{ $("quiz").classList.remove("show"); clock = cue.rewind ?? Math.max(0, cue.t - 4); mode = "replay"; }, 1150);
  }
}
function finish(){
  mode = "end";
  const n = CUES.length;
  $("stars").innerHTML = "★".repeat(firstTry) + "<span style='color:#ffffff2b'>" + "★".repeat(n - firstTry) + "</span>";
  $("stats").textContent = review ? "Режим просмотра: вопросы отключены." : "С первого раза верно: " + firstTry + " из " + n;
  $("end").classList.remove("hidden");
  saveBest(firstTry, n);
}
function resetRun(asReview){
  review = !!asReview;
  CUES.forEach(c=>{ c.done = false; c.tries = 0; c.mark.classList.remove("done"); });
  firstTry = 0; clock = 0; $("quiz").classList.remove("show");
  $("end").classList.add("hidden"); mode = "play";
  if(VOICE){ try{ VOICE.currentTime = 0; }catch(e){} if(voiceOn && !review) VOICE.play().catch(()=>{}); }
}

/* прогресс: localStorage всегда, CloudStorage когда есть */
function saveBest(stars, total){
  try{
    const key = "lesson:" + (SPEC.id || "x");
    const prev = +(localStorage.getItem(key) || 0);
    if(stars > prev) localStorage.setItem(key, String(stars));
    const tg = window.Telegram?.WebApp;
    if(tg?.CloudStorage?.setItem) tg.CloudStorage.setItem(key, String(Math.max(prev, stars)), ()=>{});
  }catch(e){}
}
function tgHaptic(kind){
  const h = window.Telegram?.WebApp?.HapticFeedback;
  if(!h) return;
  try{ kind === "select" ? h.selectionChanged() : h.notificationOccurred(kind === "ok" ? "success" : "error"); }catch(e){}
}

$("startBtn").onclick = ()=>{
  $("start").classList.add("hidden"); mode = "play";
  /* запуск звука именно здесь — жест пользователя снимает запрет автовоспроизведения */
  if(VOICE && voiceOn){ try{ VOICE.currentTime = 0; }catch(e){} VOICE.play().catch(()=>{}); }
  const tg = window.Telegram?.WebApp;
  try{ tg?.expand?.(); }catch(e){}
};
$("againBtn").onclick = ()=>resetRun(false);
$("reviewBtn").onclick = ()=>resetRun(true);
addEventListener("keydown", e=>{
  if(e.key === " "){ e.preventDefault(); togglePause(); }
  else if(e.key === "r" || e.key === "R" || e.key === "к"){ if(mode !== "idle") resetRun(false); }
  else if(e.key === "m" || e.key === "M" || e.key === "ь"){ $("soundBtn").click(); }
  else if(mode === "quiz" && ["1","2","3","4"].includes(e.key)){
    const b = $("answers").children[+e.key - 1]; if(b && !b.disabled) b.click();
  }
});
function togglePause(){
  if(mode === "play" || mode === "replay"){ prevMode = mode; mode = "paused"; }
  else if(mode === "paused"){ mode = prevMode; }
}

/* ============ Telegram Mini App ============ */
(function initTg(){
  const tg = window.Telegram?.WebApp;
  if(!tg) return;
  const applyViewport = ()=>{
    const h = tg.viewportStableHeight || innerHeight;
    document.documentElement.style.setProperty("--vh", h + "px");
    const st = document.getElementById("stage");
    st.style.height = Math.min(h, innerWidth * 16 / 9) + "px";
    const cs = tg.contentSafeAreaInset || {};
    document.documentElement.style.setProperty("--sat", ((cs.top || 0) + (tg.safeAreaInset?.top || 0)) + "px");
    document.documentElement.style.setProperty("--sab", ((cs.bottom || 0) + (tg.safeAreaInset?.bottom || 0)) + "px");
  };
  try{ tg.ready(); tg.expand(); applyViewport(); }catch(e){}
  try{ tg.onEvent?.("viewportChanged", applyViewport); }catch(e){}
  try{ typeof tg.disableVerticalSwipes === "function" && tg.disableVerticalSwipes(); }catch(e){}
})();

/* ============ цикл ============ */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if(mode === "play" || mode === "replay"){
    clock += dt * speed;
    if(clock >= SPEC.duration){ clock = SPEC.duration; render(clock); finish(); }
    else if(!review){
      const cue = CUES.find(c=>!c.done && clock >= c.t);
      if(cue) openQuiz(cue);
    }
  }
  render(clock);
  syncVoice();
  requestAnimationFrame(loop);
}

boot();
applySoundBtn();
/* ?t=NN — кадр на заданном времени (для рендера видео). ?review=1 — без вопросов и звука. */
(function(){
  const q = new URLSearchParams(location.search);
  if(q.has("review")) review = true;
  if(q.has("t")){
    $("start").classList.add("hidden");
    clock = parseFloat(q.get("t")); mode = "paused"; render(clock);
  }
})();
render(clock);
requestAnimationFrame(loop);
</script>
